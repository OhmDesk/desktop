# Opens an empty draft release for a version, in OhmDesk's name rather than a person's.
# The installer and its small "which version is out" file are then added to the draft from
# the computer that built them, and the draft is published. Run it from the Actions tab, or:
#   gh workflow run release.yml --repo OhmDesk/desktop -f version=0.4.0
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version, as in the app's package.json (0.4.0)"
        required: true

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Open the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft \
            --title "OhmDesk $VERSION" \
            --notes "OhmDesk for Windows. Download it from https://www.ohmdesk.com/download"
